services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smm
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ../backend
    depends_on: [postgres, redis]
    # Picks up SMM_LLM_OPENAI_API_KEY and friends from the developer's local
    # backend/.env without baking secrets into this file. environment: below
    # still wins over env_file for the same key (DATABASE_URL/REDIS_URL must
    # point at the docker network's service names, not .env's localhost ones).
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres/smm
      REDIS_URL: redis://redis
      # The browser calls the API from the frontend's origin, not the docker
      # network -- this must match wherever the frontend is actually served.
      SMM_API_CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      # backend writes the uploaded file to disk, then hands the *path* to a
      # Celery task -- without a shared volume, worker-ingest (a separate
      # container, separate filesystem) can't open it. Bit us for real: this
      # only ever worked in local dev because backend/worker ran as bare
      # processes sharing the host filesystem, not containers.
      - uploads:/app/uploads
      # The cross-encoder reranker (retrieval/rerank.py) downloads a ~1GB
      # model from Hugging Face on first use if not cached -- without a
      # persistent volume, every container restart re-downloads it, which is
      # both slow and a new dependency on the query path exactly where P2/P5
      # care most about latency floors.
      - hf-cache:/root/.cache/huggingface
  worker-ingest:
    build: ../backend
    command: celery -A app.infra.celery_app worker -Q ingest --loglevel=info --concurrency=4
    depends_on: [postgres, redis]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres/smm
      REDIS_URL: redis://redis
    volumes:
      - uploads:/app/uploads
  worker-core:
    build: ../backend
    # Core builds run for hours against dozens of curated sources -- its own
    # queue and concurrency, deliberately not sharing worker-ingest (Step
    # 2's brand-file queue is latency-bound; this one is throughput-bound and
    # must never starve, or be starved by, a Team Lead's file upload).
    command: celery -A app.infra.celery_app worker -Q core --loglevel=info --concurrency=2
    depends_on: [postgres, redis]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres/smm
      REDIS_URL: redis://redis
    volumes:
      # Curated Market Intel Core source docs -- distinct from the per-brand
      # `uploads` volume: these are operator-provided, not client-uploaded,
      # and never touch a run:<brand_id> KB.
      - core-sources:/app/core-sources
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
  hf-cache:
  core-sources:
