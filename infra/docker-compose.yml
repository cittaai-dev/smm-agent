services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smm
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ../backend
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres/smm
      REDIS_URL: redis://redis
    ports: ["8000:8000"]
  worker:
    build: ../backend
    command: celery -A app.workers worker --loglevel=info
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres/smm
      REDIS_URL: redis://redis
  frontend:
    build: ../frontend
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
