# step6_production_operations.md §11 -- reference manifest, not deployed
# from this repo: there's no cluster here to apply it against (same status as
# docker-compose.yml's `beat` service before an operator wires it up). Kept
# in the repo so the shape (zero-downtime rolling update, liveness vs.
# readiness split) is reviewed like code, not invented at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  # maxUnavailable: 0 is the whole point of Part C §12's "kill a pod
  # mid-deploy -> zero dropped requests" drill -- a new pod must be Ready
  # before an old one terminates.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: REGISTRY/backend:TAG # set by .github/workflows/deploy.yml at deploy time
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: backend-env } # DATABASE_URL, REDIS_URL, SMM_LLM_OPENAI_API_KEY, etc.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 80
      targetPort: 8000
